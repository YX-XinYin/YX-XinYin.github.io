name: Get Citation Data

# Google Scholar frequently blocks GitHub Actions IPs, so automatic daily
# runs mostly fail and spam failure emails. Keep this manual-only; soft-fail
# if Scholar is unreachable so a blocked crawl does not mark the run failed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Reqs
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-setuptools python3-pip
    - name: Run
      run: |
        cd ./google_scholar_crawler
        pip3 install --break-system-packages -r requirements.txt
        if ! python3 main.py; then
          echo "Citation crawl failed (usually Google Scholar blocking CI). Skipping push."
          exit 0
        fi
        if [ ! -d ./results ] || ! ls ./results/*.json >/dev/null 2>&1; then
          echo "No citation JSON produced. Skipping push."
          exit 0
        fi
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        export remote_repo="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
